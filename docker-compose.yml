version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: labeled-db
    environment:
      POSTGRES_DB: labeled
      POSTGRES_USER: labeled
      POSTGRES_PASSWORD: labeled_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeled"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: labeled-backend
    environment:
      DATABASE_URL: postgresql://labeled:labeled_password@postgres:5432/labeled
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./labeled:/app/labeled
      - ./platform:/app/platform
      - ./backend:/app/backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: labeled-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production

volumes:
  postgres_data:
